services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: koreamate
      POSTGRES_PASSWORD: koreamate
      POSTGRES_DB: koreamate
    ports: ["5432:5432"]
    volumes: ["koreamate-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  koreamate-postgres:
