<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">KoreaMate 3.0 产品图集</title>
  <desc id="desc">六宫格展示 KoreaMate 的对话规划、受控工作流、真实地点、旅行记忆、图片翻译和开源协作能力。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0d2942" flood-opacity=".12"/></filter>
    <style>
      .panel{fill:#f5f9fc;stroke:#d9e7ef;stroke-width:2}.title{font:700 22px Arial,sans-serif;fill:#102c43}.sub{font:14px Arial,sans-serif;fill:#527087}.tiny{font:12px Arial,sans-serif;fill:#527087}.cyan{fill:#18b7df}.navy{fill:#102c43}.lime{fill:#dff56e}.white{fill:#fff}.line{stroke:#18b7df;stroke-width:3;fill:none}.thin{stroke:#a8c4d2;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="1200" height="780" fill="#ffffff"/>
  <text x="48" y="48" class="title" font-size="28">KoreaMate 3.0 · 从一句话到可执行的韩国旅行</text>
  <text x="48" y="75" class="sub">真实地点、受控 AI 工作流、可管理记忆与图片内翻译</text>
  <!-- panel 1 -->
  <g transform="translate(40 105)"><rect width="360" height="300" rx="18" class="panel"/>
    <text x="24" y="42" class="title">一句话规划</text><text x="24" y="66" class="sub">对话补齐关键条件</text>
    <rect x="24" y="92" width="210" height="42" rx="12" class="white" filter="url(#shadow)"/><text x="38" y="118" class="tiny">国庆去首尔 5 天，想吃烤肉</text>
    <rect x="82" y="156" width="220" height="42" rx="12" class="cyan"/><text x="96" y="182" fill="#fff" class="tiny">预算和同行人数是多少？</text>
    <rect x="24" y="220" width="190" height="42" rx="12" class="lime"/><text x="38" y="246" class="tiny">两个人，人均 5000 元</text>
    <circle cx="310" cy="250" r="27" class="navy"/><path d="M298 250h24M313 241l9 9-9 9" stroke="#fff" stroke-width="3" fill="none"/>
  </g>
  <!-- panel 2 -->
  <g transform="translate(420 105)"><rect width="360" height="300" rx="18" class="panel"/>
    <text x="24" y="42" class="title">受控工作流</text><text x="24" y="66" class="sub">一个模型，四类明确职责</text>
    <rect x="28" y="98" width="125" height="52" rx="10" class="white" stroke="#18b7df" stroke-width="2"/><text x="45" y="128" class="tiny">需求整理</text>
    <rect x="207" y="98" width="125" height="52" rx="10" class="white" stroke="#18b7df" stroke-width="2"/><text x="224" y="128" class="tiny">旅行规划</text>
    <rect x="28" y="196" width="125" height="52" rx="10" class="white" stroke="#18b7df" stroke-width="2"/><text x="45" y="226" class="tiny">翻译与 OCR</text>
    <rect x="207" y="196" width="125" height="52" rx="10" class="white" stroke="#18b7df" stroke-width="2"/><text x="224" y="226" class="tiny">记忆与攻略</text>
    <path d="M153 124h54M270 150v46M207 222h-54M90 196v-46" class="line" marker-end="url(#none)"/>
    <circle cx="180" cy="173" r="18" class="lime"/><text x="169" y="178" class="tiny">API</text>
  </g>
  <!-- panel 3 -->
  <g transform="translate(800 105)"><rect width="360" height="300" rx="18" class="panel"/>
    <text x="24" y="42" class="title">真实地点与行程</text><text x="24" y="66" class="sub">Provider 核验后再安排路线</text>
    <rect x="24" y="92" width="312" height="132" rx="12" fill="#dceff5"/>
    <path d="M24 170c42-35 70 20 110-18s70 24 108-18 63 10 94-22M36 112c35 28 64 18 91 46s61-14 91 14 70-6 108 18" class="thin"/>
    <circle cx="88" cy="158" r="8" class="cyan"/><circle cx="178" cy="151" r="8" class="cyan"/><circle cx="278" cy="185" r="8" class="cyan"/><path d="M88 158l90-7 100 34" class="line"/>
    <rect x="24" y="242" width="95" height="32" rx="9" class="white"/><text x="39" y="263" class="tiny">已核验 · Kakao</text>
    <rect x="132" y="242" width="95" height="32" rx="9" class="white"/><text x="146" y="263" class="tiny">天气参考</text>
    <rect x="240" y="242" width="96" height="32" rx="9" class="lime"/><text x="255" y="263" class="tiny">第 2 天</text>
  </g>
  <!-- panel 4 -->
  <g transform="translate(40 435)"><rect width="360" height="300" rx="18" class="panel"/>
    <text x="24" y="42" class="title">记忆由你掌控</text><text x="24" y="66" class="sub">长期偏好只补充空白</text>
    <rect x="24" y="94" width="312" height="48" rx="10" class="white"/><circle cx="50" cy="118" r="10" class="cyan"/><text x="72" y="123" class="tiny">旅行节奏：轻松，不赶行程</text><text x="295" y="123" class="tiny">删除</text>
    <rect x="24" y="154" width="312" height="48" rx="10" class="white"/><circle cx="50" cy="178" r="10" class="lime"/><text x="72" y="183" class="tiny">兴趣：咖啡、城市散步</text><text x="295" y="183" class="tiny">删除</text>
    <rect x="24" y="214" width="312" height="48" rx="10" class="navy"/><text x="44" y="243" fill="#fff" class="tiny">本次输入  &gt;  已确认  &gt;  长期偏好</text>
  </g>
  <!-- panel 5 -->
  <g transform="translate(420 435)"><rect width="360" height="300" rx="18" class="panel"/>
    <text x="24" y="42" class="title">图片内翻译</text><text x="24" y="66" class="sub">韩文菜单 → 中文覆盖 → 可带走</text>
    <rect x="24" y="92" width="312" height="126" rx="12" fill="#ead9bc"/>
    <rect x="46" y="112" width="105" height="26" rx="5" fill="#fff" fill-opacity=".8"/><text x="57" y="130" class="tiny">김치찌개 8,000₩</text>
    <rect x="177" y="151" width="112" height="26" rx="5" fill="#fff" fill-opacity=".9"/><text x="187" y="169" class="tiny">泡菜汤 8,000₩</text>
    <rect x="43" y="109" width="111" height="32" fill="none" stroke="#18b7df" stroke-width="2" stroke-dasharray="5 4"/><rect x="174" y="148" width="118" height="32" fill="none" stroke="#18b7df" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="24" y="242" width="138" height="32" rx="9" class="white"/><text x="39" y="263" class="tiny">PaddleOCR · 置信度</text><rect x="174" y="242" width="162" height="32" rx="9" class="lime"/><text x="189" y="263" class="tiny">原图 / 译图切换</text>
  </g>
  <!-- panel 6 -->
  <g transform="translate(800 435)"><rect width="360" height="300" rx="18" fill="#18b7df"/>
    <text x="24" y="48" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">KoreaMate 3.0</text><text x="24" y="75" font-family="Arial,sans-serif" font-size="15" fill="#e9fbff">欢迎参与贡献</text>
    <rect x="24" y="102" width="312" height="86" rx="14" fill="#fff" fill-opacity=".94"/><text x="44" y="132" class="tiny">旅行规划 · 中韩翻译 · 本地推理</text><text x="44" y="158" class="tiny">NestJS + Next.js + PostgreSQL</text>
    <rect x="24" y="216" width="92" height="38" rx="10" class="navy"/><text x="42" y="240" fill="#fff" class="tiny">Star</text><rect x="134" y="216" width="92" height="38" rx="10" class="lime"/><text x="153" y="240" class="tiny">Issue</text><rect x="244" y="216" width="92" height="38" rx="10" class="white"/><text x="260" y="240" class="tiny">PR</text>
    <circle cx="320" cy="42" r="25" class="lime"/><path d="M308 42h24M320 30v24" stroke="#102c43" stroke-width="3"/>
  </g>
</svg>
