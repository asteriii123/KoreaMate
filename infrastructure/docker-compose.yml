services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: koreamate_v3
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d koreamate_v3"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - koreamate_v3_postgres:/var/lib/postgresql/data
  korea-tourism-mcp:
    profiles: ["providers"]
    build:
      context: ..
      dockerfile: infrastructure/mcp-korea-tourism.Dockerfile
    environment:
      KOREA_TOURISM_API_KEY: ${KOREA_TOURISM_API_KEY:-}
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
    ports:
      - "58000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  koreamate_v3_postgres:
