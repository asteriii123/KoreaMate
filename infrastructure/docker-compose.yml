services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: koreamate_v3
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d koreamate_v3"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - koreamate_v3_postgres:/var/lib/postgresql/data

volumes:
  koreamate_v3_postgres:
